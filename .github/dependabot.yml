# Dependabot configuration.
# Tuned per GitHub's "tame Dependabot" guidance: batch version updates into a
# few grouped PRs on a slow (monthly) cadence, with a release cooldown. Security
# updates ignore groups/schedule and still open immediately.

version: 2
updates:
  # Cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    reviewers:
      - "wdecoster"
    assignees:
      - "wdecoster"
    commit-message:
      prefix: "cargo"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    # Minor+patch land together; majors are grouped separately so one breaking
    # bump can't wedge the routine batch. (Previously only patch updates were
    # grouped, so minors and majors opened as individual PRs.)
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
    # Wait a few days after a release before opening a version-update PR, so a
    # compromised fresh release has time to be flagged.
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
