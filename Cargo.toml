[package]
name = "cramino"
version = "2.0.0"
edition = "2024"
authors = ["Wouter De Coster decosterwouter@gmail.com"]
license = "MIT"
description = "A tool to quickly extract quality metrics from bam or cram files"
readme = "README.md"
homepage = "https://github.com/wdecoster/cramino"
repository = "https://github.com/wdecoster/cramino"
keywords = ["ont", "pacbio", "cram", "bam", "alignment"]
categories = ["command-line-utilities", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rust-htslib = { version = "1.0.0", features = ["s3", "libdeflate"] }
log = "0.4.30"
env_logger = "0.11.10"
chrono = "0.4.44" 
rayon = "1.12.0"
arrow = "59.0.0"
unzip-n = "0.1.4"
itertools = "0.15.0"

libz-sys = "1.1.29"
url = "2.5.8"
hts-sys = "2.1.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
ctor = "1.0.7"
